<!DOCTYPE html>
<div>
    <!-- 操作栏 -->
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold text-gray-900">📚 知识库管理</h2>
        <div class="flex space-x-3">
            <button class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700"
                    hx-get="/admin/kb/upload-form"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    onclick="document.getElementById('modal-container').classList.remove('hidden')">
                📤 上传文档
            </button>
            <button class="px-4 py-2 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700"
                    hx-get="/admin/kb/article-form"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    onclick="document.getElementById('modal-container').classList.remove('hidden')">
                ✏️ 新建条目
            </button>
        </div>
    </div>

    <!-- 搜索/筛选栏 -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
        <form hx-get="/admin/kb"
              hx-trigger="input delay:300ms from:#search, change from:#category"
              hx-target="#kb-list"
              hx-swap="innerHTML"
              class="flex items-center space-x-4">
            <input id="search" name="search" type="text" placeholder="搜索知识条目..."
                   class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm">
            <select id="category" name="category"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                <option value="">全部分类</option>
                <option value="project_application">项目申报</option>
                <option value="field_survey">现场调查</option>
                <option value="testing_sampling">检测采样</option>
                <option value="evaluation_report">评价报告</option>
                <option value="project_publication">项目公示</option>
                <option value="system_settings">系统设置</option>
                <option value="general">通用</option>
            </select>
        </form>
    </div>

    <!-- 条目列表（HTMX 部分刷新） -->
    <div id="kb-list" class="bg-white rounded-lg shadow-sm divide-y divide-gray-200">
        <div class="p-8 text-center text-gray-400">
            <p>知识库条目列表（开发阶段占位）</p>
            <p class="text-sm mt-1">连接数据库后将展示实际数据</p>
        </div>
    </div>
</div>

<!-- Modal 容器 -->
<div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center">
</div>
