name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: ohkb_test
          POSTGRES_USER: ohkb_test
          POSTGRES_PASSWORD: ohkb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn compile -B -q
        env:
          DB_USERNAME: ohkb_test
          DB_PASSWORD: ohkb_test

      - name: Run Tests
        run: mvn test -B
        env:
          DB_USERNAME: ohkb_test
          DB_PASSWORD: ohkb_test
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          JWT_SECRET: test-jwt-secret-ci

      - name: Package
        run: mvn package -DskipTests -B -q

      - name: Verify JAR
        run: ls -lh kb-boot/target/kb-boot-*.jar

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkstyle (optional, non-blocking)
        run: echo "Lint step — add Checkstyle/SpotBugs configuration as needed"
