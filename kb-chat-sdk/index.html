<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OHKB Chat SDK - Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f5f5f5; min-height: 100vh; }
    .demo-header { background: #1a1a2e; color: white; padding: 16px 24px;
                   display: flex; align-items: center; gap: 12px; }
    .demo-header h1 { font-size: 18px; font-weight: 600; }
    .demo-header span { font-size: 12px; opacity: 0.7; }
    .demo-body { display: flex; height: calc(100vh - 56px); }
    .demo-main { flex: 1; padding: 40px; display: flex; align-items: center;
                 justify-content: center; }
    .demo-card { background: white; border-radius: 12px; padding: 40px;
                 box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 500px;
                 text-align: center; }
    .demo-card h2 { margin-bottom: 12px; color: #1a1a2e; }
    .demo-card p { color: #666; margin-bottom: 20px; line-height: 1.6; }
    .demo-card .badge { display: inline-block; background: #e8f4fd;
                        color: #1976d2; padding: 4px 12px; border-radius: 20px;
                        font-size: 12px; margin: 4px; }
    #ohkb-chat-root { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>OHKB Chat SDK</h1>
    <span>Demo Page — 右下角打开聊天窗口</span>
  </div>
  <div class="demo-body">
    <div class="demo-main">
      <div class="demo-card">
        <h2>职业健康检测 SaaS 系统</h2>
        <p>这是一个演示页面，模拟主 SaaS 系统嵌入 AI 聊天组件。</p>
        <p>点击右下角的 <strong>💬 帮助</strong> 按钮开始提问。</p>
        <div>
          <span class="badge">项目申报</span>
          <span class="badge">现场调查</span>
          <span class="badge">检测采样</span>
          <span class="badge">评价报告</span>
          <span class="badge">项目公示</span>
        </div>
      </div>
    </div>
  </div>

  <div id="ohkb-chat-root"></div>
  <script type="module">
    import { mount } from './src/mount.ts';
    mount('#ohkb-chat-root', {
      apiBase: 'http://localhost:8080',
      token: 'demo-token',
      pageContext: { module: 'project_application', action: 'demo' },
    });
  </script>
</body>
</html>
